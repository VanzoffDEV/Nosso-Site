<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Vanzoff</title>
    <link rel="stylesheet" href="login-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="Login-Wrapper">
    <div class="Login-Box">
        <div class="Login-Header">
            <img src="images/Vanzoff agencia.png" alt="Logo Vanzoff">
            <h2>Área Restrita</h2>
            <p>Identifique-se para acessar o painel</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>

        <div class="Login-Footer">
            <a href="index.html">⬅️ Voltar para o site principal</a>
        </div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
