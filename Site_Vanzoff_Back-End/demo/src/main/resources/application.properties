# ==========================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================================
spring.application.name=Site_Vanzoff_Back-End
server.port=8080

spring.jpa.open-in-view=false

# ==========================================================
# CREDENCIAIS DE ACESSO (LOGIN DO PAINEL)
# ==========================================================
# Mudamos para ler do .env
spring.security.user.name=${ADMIN_USER}
spring.security.user.password=${ADMIN_HASH}

# ==========================================================
# CONEXÃO COM O BANCO DE DADOS
# ==========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================================
# CONFIGURAÇÃO DE E-MAIL (GMAIL)
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Nunca deixe o e-mail ou a senha do Gmail expostos aqui
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true