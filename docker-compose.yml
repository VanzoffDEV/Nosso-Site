version: '3.8'

services:
  # Nosso Banco de Dados PostgreSQL
  db:
    image: postgres:15
    container_name: vanzoff_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: vanzoff_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: